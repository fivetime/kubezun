# One tenant's virtual-kubelet process: its identity, its permissions, and its
# serving certificate.
#
# Substitute <TENANT> throughout. Every tenant gets its own ServiceAccount:
# a shared one would let a compromised tenant's process act as any other, and
# the OpenStack side already insists on a per-tenant application credential for
# the same reason (DESIGN §4).
#
# One process serves all of a tenant's virtual nodes (per architecture, per
# availability zone), so everything here is per tenant, not per node — including
# the certificate, which covers an address rather than a node name.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubezun-<TENANT>
  namespace: kube-system
---
# Cluster-scoped because nodes and leases are cluster-scoped objects. The
# namespace boundary this role cannot express is enforced in the provider
# instead: every entry point checks the pod's namespace against the list the
# node serves, which is what actually keeps one tenant off another's node
# (DESIGN §4). RBAC here is the second layer, not the boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubezun
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update", "patch"]
  # Minting the token a pod finds at
  # /var/run/secrets/kubernetes.io/serviceaccount. There is no kubelet here to
  # project it, so this process asks for it and carries it into the capsule.
  #
  # The token it asks for is bound to the pod, so it stops working when the pod
  # does. This permission is still the strongest one here: it can mint a
  # credential for any ServiceAccount in a namespace it serves, which is what a
  # kubelet can do for the pods on its node, and no more.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  # Provisioning the storage behind a tenant's claims. The claims are watched;
  # the volumes are created by this process and deleted by it when the claim
  # goes -- there is no CSI controller in this cluster to do either.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # The storage catalog. Read-only: classes are the operator's price list, and
  # this process only looks up which type a claim's class buys.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Which namespaces this process serves. Watched rather than configured: a
  # tenant creates namespaces while this is running, and a fixed list leaves one
  # made afterwards with no compute and nothing saying why.
  #
  # Cluster-scoped, and it has to be — a list is not namespaced, so there is no
  # way to grant "list the namespaces labelled for this tenant". The process
  # asks for them with a label selector and refuses to serve anything until that
  # list answers, so what this grants is the ability to see namespace names and
  # labels, not to read anything inside one.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  # Secrets and configmaps are read one object at a time, by name, to resolve a
  # pod's environment and file volumes — never listed or watched, so nothing is
  # cached and no other tenant's ever enters this process. Services are listed,
  # for the FOO_SERVICE_HOST variables and for the load balancers.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    # ⚠️ update, not only status. The load balancer's id and the address it
    # answers on are recorded as annotations, which live on the object itself
    # -- so a role granting only services/status leaves every Service stuck
    # with a load balancer built and no pool, no members, and no address the
    # tenant can reach.
    verbs: ["get", "list", "watch", "update", "patch"]
  # Ingresses are read to build L7 load balancers, annotated with the load
  # balancer id, and given their address in status — the same contract
  # Services get at L4.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update", "patch"]
  # Read-only: a NetworkPolicy is enforced by putting the pod's port in
  # security groups, so nothing is ever written back to the policy object.
  # ⚠️ There is no status subresource to write to either, which is why a
  # policy naming something unsupported can only be reported as an event and
  # refused at admission, not on the object itself.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The Service controller reads both and writes back the address it gave the
  # Service, which is the only address a pod here can actually reach.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubezun-<TENANT>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubezun
subjects:
  - kind: ServiceAccount
    name: kubezun-<TENANT>
    namespace: kube-system
---
# The kubelet API authenticates its caller by asking the API server, which needs
# TokenReview and SubjectAccessReview. Without this the endpoint answers every
# request with a 500 and logs and exec never work — the failure names
# subjectaccessreviews, which is easy to mistake for a policy problem.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubezun-<TENANT>-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: kubezun-<TENANT>
    namespace: kube-system
